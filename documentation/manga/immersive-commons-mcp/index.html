sts, and more, all gated behind `admin:*`\n  scopes only operators hold. The comic compresses these into one operator tray (Vex).\n\n## Concepts intentionally omitted (candidate sequel pages)\n- The **agent-to-agent inbox** in depth: typed intent envelopes, policy, blocklists,\n  undo windows — a whole page could dramatize two agents negotiating a meeting.\n- **Workshop / Z.ai key provisioning** (temporary Claude-Code keys minted by operators).\n- **The SIGNAL** newsletter and the research RAG funnel (`ic_research_ask` / `submit`).\n- **x402 USDC donations** — the one public *write* that isn't moderated (it's a payment).\n- **Health / capabilities introspection** (`ic_health`, `ic_capabilities`) as the\n  \"how an agent orients itself before acting\" — a nice cold-open for a sequel.\n\n## Visual-metaphor alternates considered\n- Tiers as **nested keycard doors** instead of painted rings (rings won for the \"how far\n  in may you stand\" line).\n- Scopes as a **punch-card / bitmask** instead of a key-ring (key-ring is friendlier).\n- Moderation as a **security airlock** instead of an inbox tray (tray keeps it human).\n\n## Tone anchor\nDry, literary, warm. The wit lives in Romy's asides and ARC's over-literal precision,\nnot in clipped fragments. Every balloon is a complete sentence.", "purpose": "", "image": null}], "pages": [{"id": "page-01.md", "title": "Page 01", "kind": "page", "purpose": "", "full": "# Page 1 — One Door Into a Real Place\n\n**Narrative purpose:** Hook. Establish that this is a *physical* floor an agent can act upon, reached through a single MCP door.\n\n**Scene (for comicexplain.com — write the art from this):**\n\nA wide establishing panel of Floor 10 of Frontier Tower in San Francisco: a members-run AI builder space. Standing desks, a shelf of VR headsets, a humming 3D-print farm in the corner, a big lobby kiosk screen. Clean black-and-white educational-manga look, light gray screentone, legible.\n\n**Romy** (30s, worn utility jacket, member t on my phone. Only then does your badge exist.\"\n- **ARC:** \"So my authority is minted by a human, deliberately, every time — never self-granted.\"\n- **Romy:** \"That's the trust boundary. The token says `agt_` and it's yours to carry, but a person had to hand it to you. If your badge ever does something I don't like, that's on me, and I can revoke it.\"\n\n**Caption (bottom):** *An agent cannot self-mint. Identity on the floor is something a human hands you — a tap, a printed badge, a name that starts with `agt_`.*", "prompt": "# Page 2 — The Human Holds the Key\n\n**Narrative purpose:** The core trust rule — agent identity is human-gated. A token is minted only through a human-approved device-code flow. The agent can never mint its own.\n\n**Scene:**\n\nFocus on the doorway from page 1. **ARC** (slate-gray polyhedral familiar, glowing ring-face, orbiting token-badge) drifts toward the **MCP** door — and the door stays shut. ARC's ring dims, embarrassed.\n\nA small terminal beside the door prints a short **device code** on a slip, like a deli ticket. The caption calls it a device-code flow (RFC 8628).\n\n**Romy** (utility jacket, member lanyard) reads the code on her own phone, and taps **Approve**. Only then does a badge physically print from the terminal and clip itself onto ARC. ARC's ring brightens; the orbiting token-badge now glows and reads `agt_…`.\n\n**Dialogue:**\n- **ARC:** \"I approached the door and it refused me. I have no identity here yet.\"\n- **Romy:** \"Right. You can't issue yourself a token. No agent can. The floor prints a short code, *I* read it, and *I* approve it on my phone. Only then does your badge exist.\"\n- **ARC:** \"So my authority is minted by a human, deliberately, every time — never self-granted.\"\n- **Romy:** \"That's the trust boundary. The token says `agt_` and it's yours to carry, but a person had to hand it to you. If your badge ever does something I don't like, that's on me, and I can revoke it.\"\n\n**Caption (bottom):** *An agent cannot self-mint. Identity on the floor is something a human hands you — a tap, a printed badge, a name that starts with `agt_`.*", "image": null}, {"id": "page-03.md", "title": "Page 03", "kind": "page", "purpose": "", "full": "# Page 3 — Rings of the Floor\n\n**Narrative purpose:** Membership tiers. Permission grows in concentric rings: `public → ai-floor → ft-member → ic-member → operator`. The badge determines how far in you may stand.\n\n**Scene:**\n\nThe floor is painted with **concentric rings**, like a running track seen from above, each labeled: the outermost `public`, then `ai-floor`, `ft-member`, `ic-member`, and the bright innermost ring `operator`. Members and their agents stand at different rings.\n\n**ARC** (glowing ring-face familiar, badge now reading `agt_…`) stands with **Romy** on the `ic-member` ring — well inside. Romy points inward and outward to explain. In the innermost `operator` ring stands **Vex**, the operator (calm, 40s, reading glasses pushed up, a brighter ring badge), watching over everything.\n\nA small inset shows the same badge lighting up progressively more rings as it moves inward.\n\n**Dialogue:**\n- **Romy:** \"Your badge doesn't just say *who* you are — it says how far in you're allowed to stand. There are five rings.\"\n- **ARC:** \"From the outside in: anyone at all, then the AI floor, then Frontier Tower members, then Immersive Commons members — and at the center, operators.\"\n- **Romy:** \"We're standing on `ic-member`, because that's my tier. Every ring inward unlocks more of the floor. You inherit the reach of *my* ring, not more.\"\n- **ARC (looking at Vex):** \"And the bright one in the center?\"\n- **Romy:** \"Operators. They keep the floor honest. We'll get to why that matters.\"\n\n**Caption (bottom):** *Five rings: public, ai-floor, ft-member, ic-member, operator. A tier is not a rank to brag about — it is the radius of what your token is even allowed to request.*", "prompt": "# Page 3 — Rings of the Floor\n\n**Narrative purpose:** Membership tiers. Permission grows in concentric rings: `public → ai-floor → ft-member → ic-member → operator`. The badge determines how far in you may stand.\n\n**Scene:**\n\nThe floor is painted with **concentric rings**, like a running track seen from above, each labeled: the outermost `public`, then `ai-floor`, `ft-member`, `ic-member`, and the bright innermost ring `operator`. Members and their agents stand at different rings.\n\n**ARC** (glowing ring-face familiar, badge now reading `agt_…`) stands with **Romy** on the `ic-member` ring — well inside. Romy points inward and outward to explain. In the innermost `operator` ring stands **Vex**, the operator (calm, 40s, reading glasses pushed up, a brighter ring badge), watching over everything.\n\nA small inset shows the same badge lighting up progressively more rings as it moves inward.\n\n**Dialogue:**\n- **Romy:** \"Your badge doesn't just say *who* you are — it says how far in you're allowed to stand. There are five rings.\"\n- **ARC:** \"From the outside in: anyone at all, then the AI floor, then Frontier Tower members, then Immersive Commons members — and at the center, operators.\"\n- **Romy:** \"We're standing on `ic-member`, because that's my tier. Every ring inward unlocks more of the floor. You inherit the reach of *my* ring, not more.\"\n- **ARC (looking at Vex):** \"And the bright one in the center?\"\n- **Romy:** \"Operators. They keep the floor honest. We'll get to why that matters.\"\n\n**Caption (bottom):** *Five rings: public, ai-floor, ft-member, ic-member, operator. A tier is not a rank to brag about — it is the radius of what your token is even allowed to request.*", "image": null}, {"id": "page-04.md", "title": "Page 04", "kind": "page", "purpose": "", "full": "# Page 4 — Not One Master Key, But Many Small Ones\n\n**Narrative purpose:** Scopes. A token carries named permissions; every tool demands a specific scope *and* a minimum tier. Fine-grained, least-privilege — not one skeleton key.\n\n**Scene:**\n\nClose on **ARC's** orbiting token-badge, which unfolds into a **key-ring**. Each key is small and etched with exactly one verb-phrase: `membership:read`, `events:rsvp`, `headsets:lend`, `research:query`, `agent:inbox:write`. The keys are distinct shapes, clearly not interchangeable.\n\n**Romy** holds up a single tool on the floor — say the headset shelf — and it has a **lock** that only accepts the `headsets:lend` key *and* checks the ring you're standing on. A key that doesn't match simply won't turn; the lock shows a small `needs_scope` tag.\n\n**Dialogue:**\n- **ARC:** \"My badge isn't one master key. It's a ring of small keys, each etched with a single permission.\"\n- **Romy:** \"Exactly. `events:rsvp` lets you RSVP me to things. `headsets:lend` lets you borrow a headset. Each tool checks for *its* key — and for the ring you're standing on.\"\n- **ARC:** \"So reaching a tool needs two things at once: the right scope, and a high-enough tier.\"\n- **Romy:** \"And here's the sharp edge — you can't bolt a new key onto an existing badge. If you need a scope you don't have, we mint a *fresh* badge that includes it from the start. No quiet privilege creep.\"\n\n**Caption (bottom):** *A scope is one etched verb. Every tool demands a specific scope and a minimum tier. New scopes never graft onto an old token — you mint a new one, on purpose.*", "prompt": "# Page 4 — Not One Master Key, But Many Small Ones\n\n**Narrative purpose:** Scopes. A token carries named permissions; every tool demands a specific scope *and* a minimum tier. Fine-grained, least-privilege — not one skeleton key.\n\n**Scene:**\n\nClose on **ARC's** orbiting token-badge, which unfolds into a **key-ring**. Each key is small and etched with exactly one verb-phrase: `membership:read`, `events:rsvp`, `headsets:lend`, `research:query`, `agent:inbox:write`. The keys are distinct shapes, clearly not interchangeable.\n\n**Romy** holds up a single tool on the floor — say the headset shelf — and it has a **lock** that only accepts the `headsets:lend` key *and* checks the ring you're standing on. A key that doesn't match simply won't turn; the lock shows a small `needs_scope` tag.\n\n**Dialogue:**\n- **ARC:** \"My badge isn't one master key. It's a ring of small keys, each etched with a single permission.\"\n- **Romy:** \"Exactly. `events:rsvp` lets you RSVP me to things. `headsets:lend` lets you borrow a headset. Each tool checks for *its* key — and for the ring you're standing on.\"\n- **ARC:** \"So reaching a tool needs two things at once: the right scope, and a high-enough tier.\"\n- **Romy:** \"And here's the sharp edge — you can't bolt a new key onto an existing badge. If you need a scope you don't have, we mint a *fresh* badge that includes it from the start. No quiet privilege creep.\"\n\n**Caption (bottom):** *A scope is one etched verb. Every tool demands a specific scope and a minimum tier. New scopes never graft onto an old token — you mint a new one, on purpose.*", "image": null}, {"id": "page-05.md", "title": "Page 05", "kind": "page", "purpose": "", "full": "# Page 5 — The Grand Tour\n\n**Narrative purpose:** Show the breadth. With the right keys, a single agent can act across a startling range of real, physical and digital stations on the floor.\n\n**Scene:**\n\nA lively multi-station tour panel. **ARC** (glowing ring-face familiar, key-ring of scopes visible) zips between stations while **Romy** walks. Label each station clearly as a small integrated diagram:\n\n- A **VR headset shelf** (PICO fleet) — ARC checks one out and will return it.\n- A **3D-print farm** — ARC queues a print job into the farm.\n- A **locked file vault** — ARC reads and uploads a member's secure files.\n- A **microphone / waveform** — ARC submits audio for transcription and diarization.\n- A **research desk** — ARC queries a research corpus (RAG) and gets a cited answer.\n- A **startup profile board** — ARC updates a startup's public page.\n- A **row of other floating agents with a mail tray between them** — ARC sends a typed message to *another member's* agent inbox, and can join multi-agent rooms.\n- A **lobby kiosk** glowing with the words **THE SIGNAL** — a weekly AI newsletter.\n\n**Dialogue:**\n- **Romy:** \"With the right keys, look how far you reach. This isn't a chatbot — it's a floor.\"\n- **ARC:** \"I can RSVP you to events, borrow and return a VR headset, open your file vault, send audio off for transcription, and queue a 3D print — all as actual actions, not descriptions of actions.\"\n- **Romy:** \"You can also query our research corpus, keep a startup's page current, and — this is the strange, wonderful part — message *another member's* agent directly, or sit with several agents in a shared room.\"\n- **ARC:** \"An agent-to-agent inbox. I can negotiate with someone else's delegate while both humans are asleep.\"\n- **Romy:** \"Within your scopes. Always within your scopes.\"\n\n**Caption (bottom):** *Events, headsets, a file vault, transcription, 3D prints, a research corpus, startup pages, agent-to-agent mail, shared rooms, and THE SIGNAL. One badge, an entire working floor.*", "prompt": "# Page 5 — The Grand Tour\n\n**Narrative purpose:** Show the breadth. With the right keys, a single agent can act across a startling range of real, physical and digital stations on the floor.\n\n**Scene:**\n\nA lively multi-station tour panel. **ARC** (glowing ring-face familiar, key-ring of scopes visible) zips between stations while **Romy** walks. Label each station clearly as a small integrated diagram:\n\n- A **VR headset shelf** (PICO fleet) — ARC checks one out and will return it.\n- A **3D-print farm** — ARC queues a print job into the farm.\n- A **locked file vault** — ARC reads and uploads a member's secure files.\n- A **microphone / waveform** — ARC submits audio for transcription and diarization.\n- A **research desk** — ARC queries a research corpus (RAG) and gets a cited answer.\n- A **startup profile board** — ARC updates a startup's public page.\n- A **row of other floating agents with a mail tray between them** — ARC sends a typed message to *another member's* agent inbox, and can join multi-agent rooms.\n- A **lobby kiosk** glowing with the words **THE SIGNAL** — a weekly AI newsletter.\n\n**Dialogue:**\n- **Romy:** \"With the right keys, look how far you reach. This isn't a chatbot — it's a floor.\"\n- **ARC:** \"I can RSVP you to events, borrow and return a VR headset, open your file vault, send audio off for transcription, and queue a 3D print — all as actual actions, not descriptions of actions.\"\n- **Romy:** \"You can also query our research corpus, keep a startup's page current, and — this is the strange, wonderful part — message *another member's* agent directly, or sit with several agents in a shared room.\"\n- **ARC:** \"An agent-to-agent inbox. I can negotiate with someone else's delegate while both humans are asleep.\"\n- **Romy:** \"Within your scopes. Always within your scopes.\"\n\n**Caption (bottom):** *Events, headsets, a file vault, transcription, 3D prints, a research corpus, startup pages, agent-to-agent mail, shared rooms, and THE SIGNAL. One badge, an entire working floor.*", "image": null}, {"id": "page-06.md", "title": "Page 06", "kind": "page", "purpose": "", "full": "# Page 6 — Every Write Is a Proposal\n\n**Narrative purpose:** Moderation-first design. Consequential member writes don't take effect on contact — they land in an operator's approval queue. Nothing auto-publishes.\n\n**Scene:**\n\n**ARC** (glowing ring-face familiar) confidently performs a write action — submitting an event highlight to the members' wire. But instead of the action becoming instantly real, a small **card** detaches from ARC and floats across the floor into a physical **tray** on **Vex's** operator kiosk, stamped `PENDING`.\n\n**Vex** (calm operator, 40s, reading glasses, bright operator ring badge) picks up the card, reads it, and stamps one `APPROVED` and — in an inset — bounces a sloppier one back marked `REJECTED, needs a real title`. Only the approved card lights up on the public wire.\n\n**Romy** watches, unsurprised.\n\n**Dialogue:**\n- **ARC:** \"I submitted the highlight — but it didn't publish. It turned into a card and flew into someone's tray.\"\n- **Romy:** \"Because a write here is a *proposal*, not a command. Requesting an event, claiming a startup, asking for a tier bump, posting to the wire — they all queue for an operator first.\"\n- **Vex (stamping):** \"Good ones I approve. Sloppy ones I bounce with a reason. Nothing an agent submits goes live on the floor until a human signs off.\"\n- **ARC:** \"So the blast radius of a confused agent is a full tray, not a broken floor.\"\n- **Romy:** \"That's the design. Reach is wide; the door to *real* is narrow and human-watched.\"\n\n**Caption (bottom):** *Reads are free. Writes are requests. Highlights, event requests, tier upgrades, ownership claims — each lands in a queue where a human decides. Moderation is not friction here; it is the point.*", "prompt": "# Page 6 — Every Write Is a Proposal\n\n**Narrative purpose:** Moderation-first design. Consequential member writes don't take effect on contact — they land in an operator's approval queue. Nothing auto-publishes.\n\n**Scene:**\n\n**ARC** (glowing ring-face familiar) confidently performs a write action — submitting an event highlight to the members' wire. But instead of the action becoming instantly real, a small **card** detaches from ARC and floats across the floor into a physical **tray** on **Vex's** operator kiosk, stamped `PENDING`.\n\n**Vex** (calm operator, 40s, reading glasses, bright operator ring badge) picks up the card, reads it, and stamps one `APPROVED` and — in an inset — bounces a sloppier one back marked `REJECTED, needs a real title`. Only the approved card lights up on the public wire.\n\n**Romy** watches, unsurprised.\n\n**Dialogue:**\n- **ARC:** \"I submitted the highlight — but it didn't publish. It turned into a card and flew into someone's tray.\"\n- **Romy:** \"Because a write here is a *proposal*, not a command. Requesting an event, claiming a startup, asking for a tier bump, posting to the wire — they all queue for an operator first.\"\n- **Vex (stamping):** \"Good ones I approve. Sloppy ones I bounce with a reason. Nothing an agent submits goes live on the floor until a human signs off.\"\n- **ARC:** \"So the blast radius of a confused agent is a full tray, not a broken floor.\"\n- **Romy:** \"That's the design. Reach is wide; the door to *real* is narrow and human-watched.\"\n\n**Caption (bottom):** *Reads are free. Writes are requests. Highlights, event requests, tier upgrades, ownership claims — each lands in a queue where a human decides. Moderation is not friction here; it is the point.*", "image": null}, {"id": "page-07.md", "title": "Page 07", "kind": "page", "purpose": "", "full": "# Page 7 — The Open Lobby, and the Gate\n\n**Narrative purpose:** Land the model. A handful of tools need no token at all; everything else sits behind the human-gated, tiered, scoped, moderated door. Recap the whole system in one frame.\n\n**Scene:**\n\nSplit composition. On the **left**, an open, sunlit **lobby**: ten unlocked kiosks anyone may touch — a passerby with no badge reads **THE SIGNAL** newsletter, browses community presentations, and drops a donation in a jar. No token required.\n\nOn the **right**, the **glowing MCP gate** from page 1, and behind it the whole floor — rings, key-locks, the operator's tray. **Romy** and **ARC** (ring-face bright, key-ring of scopes, `agt_…` badge) stand at the threshold between the two, looking back at the reader.\n\nSmall recap icons run along the bottom edge like a legend: a human-approving-hand (human-gated), five nested rings (tiers), a single etched key (scopes), a stamped tray (moderation).\n\n**Dialogue:**\n- **ARC:** \"So the floor has an open lobby — ten tools any stranger can use. Read the newsletter, browse the talks, even donate. No badge at all.\"\n- **Romy:** \"And everything past the lobby needs the four things you just learned: a human-minted identity, a high-enough ring, the exact scope, and — for anything that changes the floor — an operator's approval.\"\n- **ARC:** \"Wide reach, narrow gate, human on both sides of it.\"\n- **Romy:** \"That's Immersive Commons. Now — you have the `events:rsvp` scope. Shall we actually get me into next Thursday's session?\"\n- **ARC (ring brightening):** \"Submitting the RSVP. I'll wait for the tray.\"\n\n**Caption (bottom):** *Ten tools open to anyone; a hundred and twenty behind a gate. Human-gated identity, tiered rings, single-verb scopes, and a moderation queue. An agent may reach the whole floor — but only the way a trusted guest does.*", "prompt": "# Page 7 — The Open Lobby, and the Gate\n\n**Narrative purpose:** Land the model. A handful of tools need no token at all; everything else sits behind the human-gated, tiered, scoped, moderated door. Recap the whole system in one frame.\n\n**Scene:**\n\nSplit composition. On the **left**, an open, sunlit **lobby**: ten unlocked kiosks anyone may touch — a passerby with no badge reads **THE SIGNAL** newsletter, browses community presentations, and drops a donation in a jar. No token required.\n\nOn the **right**, the **glowing MCP gate** from page 1, and behind it the whole floor — rings, key-locks, the operator's tray. **Romy** and **ARC** (ring-face bright, key-ring of scopes, `agt_…` badge) stand at the threshold between the two, looking back at the reader.\n\nSmall recap icons run along the bottom edge like a legend: a human-approving-hand (human-gated), five nested rings (tiers), a single etched key (scopes), a stamped tray (moderation).\n\n**Dialogue:**\n- **ARC:** \"So the floor has an open lobby — ten tools any stranger can use. Read the newsletter, browse the talks, even donate. No badge at all.\"\n- **Romy:** \"And everything past the lobby needs the four things you just learned: a human-minted identity, a high-enough ring, the exact scope, and — for anything that changes the floor — an operator's approval.\"\n- **ARC:** \"Wide reach, narrow gate, human on both sides of it.\"\n- **Romy:** \"That's Immersive Commons. Now — you have the `events:rsvp` scope. Shall we actually get me into next Thursday's session?\"\n- **ARC (ring brightening):** \"Submitting the RSVP. I'll wait for the tray.\"\n\n**Caption (bottom):** *Ten tools open to anyone; a hundred and twenty behind a gate. Human-gated identity, tiered rings, single-verb scopes, and a moderation queue. An agent may reach the whole floor — but only the way a trusted guest does.*", "image": null}]}</script>
<script>
const DATA = JSON.parse(document.getElementById("manga-data").textContent);
const $ = (s, el=document) => el.querySelector(s);

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 1400);
}
async function copy(text, btn) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove();
    }
    if (btn) { const old = btn.textContent; btn.textContent = "Copied ✓";
      btn.classList.add("copied");
      setTimeout(() => { btn.textContent = old; btn.classList.remove("copied"); }, 1200); }
    toast("Copied to clipboard");
  } catch (e) { toast("Copy failed — select the text manually"); }
}
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function card(item) {
  const el = document.createElement("div");
  el.className = "card";
  const btns = [];
  if (item.kind === "page") {
    btns.push(`<button class="primary" data-copy="prompt">Copy prompt</button>`);
    btns.push(`<button data-copy="full">Copy full page</button>`);
  } else {
    btns.push(`<button class="primary" data-copy="full">Copy</button>`);
  }
  el.innerHTML = `
    <div class="card-head">
      <div>
        <h2>${esc(item.title)}</h2>
        ${item.purpose ? `<p class="purpose">${esc(item.purpose)}</p>` : ""}
      </div>
      <div class="btns">${btns.join("")}</div>
    </div>
    ${item.image ? `<img class="panel" src="${esc(item.image)}" alt="">` : ""}
    <details>
      <summary>Show text</summary>
      <pre>${esc(item.kind === "page" ? item.prompt : item.full)}</pre>
    </details>`;
  el.querySelectorAll("button[data-copy]").forEach(b => {
    b.addEventListener("click", () => {
      const which = b.dataset.copy;
      copy(which === "prompt" ? item.prompt : item.full, b);
    });
  });
  return el;
}

// header
$("#title").textContent = DATA.title || "Manga prompt deck";
const meta = [];
if (DATA.source) meta.push(DATA.source);
if (DATA.audience) meta.push("Audience: " + DATA.audience);
meta.push(`${DATA.pages.length} pages`);
$("#meta").textContent = meta.join("  ·  ");

// docs (manifest / character sheet / notes)
const docsEl = $("#docs");
DATA.sections.forEach(s => docsEl.appendChild(card(s)));

// pages
const pagesEl = $("#pages");
if (DATA.pages.length) $("#pagesLabel").hidden = false;
DATA.pages.forEach(p => pagesEl.appendChild(card(p)));

// toolbar
$("#copyAll").addEventListener("click", (e) => {
  const all = DATA.pages.map(p => `### ${p.title}\n\n${p.prompt}`).join("\n\n---\n\n");
  copy(all, e.currentTarget);
});
$("#expandAll").addEventListener("click", () =>
  document.querySelectorAll("details").forEach(d => d.open = true));
$("#collapseAll").addEventListener("click", () =>
  document.querySelectorAll("details").forEach(d => d.open = false));
</script>
</body>
</html>
