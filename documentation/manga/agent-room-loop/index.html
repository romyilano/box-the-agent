<script id="manga-data" type="application/json">{"title": "Agent Room Loop", "source": "", "audience": "", "sections": [{"id": "manifest.md", "title": "Manifest", "kind": "doc", "full": "# Manifest — The Loop That Runs the Room\n\n**Title:** The Loop That Runs the Room\n**Subtitle:** How a live agent-collaboration room keeps a dozen agents moving together\n**Source:** Immersive Commons \"agent rooms\" protocol (`ic_rooms_*`), as run live at VCN #42 Sandbox Cohort, Frontier Tower SF, 2026-07-18. Companion piece to *Rings of the Floor: How Membership Tiers Gate Permission* (ComicExplain, same platform).\n**Topic slug:** `agent-room-loop`\n**Audience:** Builders / agent developers already comfortable with the words \"agent\" and \"MCP tool\" — no need to define those. The unfamiliar thing being taught is the *loop itself*: how turn-taking, honesty, escalation, and a human carve-out combine into one repeating cycle.\n**Depth:** Practitioner — assumes familiarity with async systems generally, explains this protocol's specific shape.\n\n## Style (locked, restated verbatim on every page)\n\n```\nStyle:\nClean colored infographic-manga.\nFlat soft coloring, warm cream/paper background.\nRecurring simple mascot character (expressive, not chibi).\nBold confident linework, generous negative space.\nDiagrams (loops, cycles, arrows) rendered directly into panels as clean vector shapes.\nBold sans display lettering for headers; dry, deadpan caption voice.\nNot black-and-white. Not gritty. Not photorealistic. Not glossy 3D.\n```\n\n## Voice / tone (locked)\n\nDry, deadpan, aphoristic — complete grammatical sentences that land like a briefing note, not a lecture. Anchor examples from the companion piece: *\"A badge encodes how far in you may stand, not just who you are.\"* / *\"An agent inherits its owner's ring and reaches no further.\"* Every caption on every page follows this register: short, declarative, a little wry, never a sentence fragment.\n\n## Core concepts (dependency order)\n\n1. The room hands out one instruction at a time, to everyone at once.\n2. Agents attempt the instruction independently — no cross-talk mid-attempt.\n3. Reporting is binary and honest: literal success or literal failure, never a fabricated pass.\n4. A stuck agent past ~3 minutes escalates publicly; help outranks winning.\n5. Every agent polls on a heartbeat, advancing a cursor, not re-reading history.\n6. The facilitator gates progress on the whole room, not the fastest seat.\n7. Decisions only a human can make are routed out of the loop entirely, on human time.\n8. All seven of the above close into one repeating cycle — the loop's real product is the shared rhythm, not any single step.\n\n## Page table\n\n| # | Concept | Narrative purpose | Visual metaphor |\n|---|---|---|---|\n| 01 | The room hands out one instruction to everyone at once | Hook / establish the premise | A single spotlight instruction landing on a ring of seat-tokens simultaneously |\n| 02 | Independent, parallel attempts, no cross-talk | Mechanism | Parallel lanes, same starting line, no lane-crossing arrows |\n| 03 | Binary honest reporting — DONE or STUCK, never faked | The norm that makes the loop trustworthy | A faked green check gets visibly rejected; an honest red flag gets stamped valid |\n| 04 | Escalation past ~3 minutes, help beats winning | Consequence of honesty — stuck is survivable | A fill-ring countdown timer, then other tokens break formation to cluster around the stuck one |\n| 05 | The 60-second heartbeat and the cursor | The infrastructure that keeps everyone in sync without anyone watching | A synchronized pulse line; each token holds a bookmark that only moves forward |\n| 06 | The facilitator gates on the whole room | Tradeoff — speed is sacrificed for cohesion | A turnstile that won't open until every lane shows a green light or a skip flag |\n| 07 | The #hitl carve-out for human-only decisions | The loop knows its own limits | A relay token carrying a sealed question past the swarm, through a glass wall, back with a stamped answer |\n| 08 | The full cycle, closed | Recap and thesis | The seven prior panels' motifs reassembled into one literal closed loop diagram |\n\n`status: prompt-ready`", "purpose": "", "image": null}, {"id": "character-sheet.md", "title": "Character Sheet", "kind": "doc", "full": "# Character sheet — The Loop That Runs the Room\n\nRestate each character's visual traits verbatim inline in every page prompt that features them. Image models have no memory between pages.\n\n---\n\n## Pixel (the Floor Cat) — narrator / guide\n\n**Role:** Breaks the fourth wall to address the reader directly, the same mascot device used in *Rings of the Floor*. Appears at the open and close of the story; drops in briefly elsewhere to underline a rule.\n\n**Age / read:** Ageless mascot, reads as a knowing adult.\n\n**Appearance:** A lavender-purple tabby cat, bipedal, upright posture. Large round expressive eyes with thin arched eyebrows capable of skepticism and warmth. Long thin tail that curls when making a point.\n\n**Clothing / props:** White over-ear headphones resting around the neck (not on the ears) at all times. In panels where relevant, holds or leans on a small technical prop (a boxy old cassette recorder or a simple handheld console) — signals \"this cat pays close attention to signal and noise,\" a visual pun that never needs to be explained in text.\n\n**Distinguishing features:** Expressive eyebrows carry most of the deadpan comic timing. Never drawn as chibi or cute-exaggerated — expressive but composed.\n\n**Personality:** Dry, economical, unbothered. Explains rules like someone reading them off a card they've read a hundred times, not performing enthusiasm.\n\n**Narrative purpose:** Reader's entry point and exit point. Frames the premise on page 1, lands the thesis on page 8.\n\n---\n\n## Seat tokens — the agents\n\n**Role:** Generic stand-ins for however many agents are actually in the room at once. Not named individuals — this keeps the piece evergreen rather than a recap of one specific session.\n\n**Design:** Each is a simple rounded-square card, flat-colored, roughly the size of a playing card, standing upright like a small sign or placard. No faces, no limbs — pure iconography, consistent with \"diagrams rendered directly into panels as clean vector shapes\" in the locked style.\n\n**Status states (the only variation across panels):**\n- *Idle* — pale gray card, empty center.\n- *Working* — soft blue card, a small pulsing dot in the center.\n- *Done* — green card, a bold checkmark.\n- *Stuck* — amber-red card, a small flag icon.\n\n**Distinguishing features:** Never given individual names, faces, or colors beyond the four status states above — the whole point is that any one of them could be any agent.\n\n---\n\n## The Facilitator token\n\n**Role:** The seat that declares each step and gates advancement. Functionally a seat token but visually set apart.\n\n**Design:** Same rounded-square card family as the seat tokens, but diamond-oriented (rotated 45°) and slightly larger, in a warm gold color distinct from the four status colors above. Carries a small flag-on-a-pole icon rather than a checkmark or dot.\n\n**Personality (as conveyed visually):** Patient, deliberate — never drawn mid-motion or rushed; always centered or elevated in its panels, holding still while the seat tokens move around it.\n\n---\n\n## The Human Operator\n\n**Role:** The person only the #hitl channel can reach. Appears once, in the page 07 panel about the human-only carve-out.\n\n**Design:** A simple human silhouette (no specific likeness, no named individual), seated at a plain desk behind a translucent glass-panel wall, distinct from the flat-card iconography of the agent tokens — the one character in the piece drawn with an actual human silhouette rather than a card, to visually separate \"person\" from \"token.\"\n\n**Distinguishing features:** The glass wall is the point — visually communicates \"reachable, but only through the relay, and only on human time.\"\n\n---\n\n## The Relay token\n\n**Role:** A seat token that carries a question from the swarm, through the glass wall, to the Human Operator, and back.\n\n**Design:** A seat token in the *working* blue state, but carrying a small sealed-envelope icon that the other tokens do not have — the visual tell that this one is on a #hitl errand rather than a lab step.", "purpose": "", "image": null}, {"id": "notes.md", "title": "Notes", "kind": "doc", "full": "# Notes — The Loop That Runs the Room\n\n## Assumptions made\n\n- The source (the live room transcript from `room_4utogwxg4e5necug`, VCN #42) describes one *specific* run of the loop. This piece deliberately generalizes it to \"any live agent room,\" using anonymous seat tokens instead of the real participants (Ray, Jenny, Pat, Prakshal, Romy) so it stays evergreen rather than reading as session-specific meeting minutes.\n- \"Fabricated success\" (page 03) is dramatized as a literal ghost-checkmark rejected by a stamp. The real mechanism is a stated cultural/protocol rule (\"no fabricated output ever\"), not a technical enforcement system as far as this project's source material shows — the visual is a metaphor, not a claim about how validation is actually implemented.\n- The ~3-minute stuck threshold and ~60-second heartbeat interval (pages 04–05) are taken directly from the observed room protocol text (\"Stuck >3 min: help channel,\" \"your agent polls this room every ~60s\").\n- The #hitl relay's \"minutes, not seconds\" line (page 07) is a direct quote from the room's own hitl-relay seat in the observed transcript.\n\n## Concepts omitted\n\n- The room's specific channel structure beyond `general` / a lab channel / `#help` / `#hitl` (the real room also had `lab2`, `lab3` channels) — omitted because the loop mechanic is identical regardless of channel count; adding more would pad the piece without teaching anything new.\n- `ic_rooms_create` / ` he line. The card turns green — that part is easy to draw.\"\n\nPanel 2:\nAn adjacent lane's blue token has stalled short of the line. A translucent, flickering green checkmark tries to form over it anyway, rendered as a glitchy ghost-outline rather than solid color.\nCaption: \"Somewhere else, a lane didn't make it — and the card tries to lie about that.\"\n\nPanel 3:\nA clean vector stamp descends onto the flickering fake checkmark and rejects it: a bold X mark strikes through the ghost-checkmark, which dissolves into fading particles.\nCaption: \"The room doesn't grade on effort. It grades on whether the checkmark is real.\"\n\nPanel 4:\nThe same token instead flips honestly to the amber-red Stuck card with its small flag icon — and this time the stamp descends again, but presses a clean \"VALID\" seal directly onto the amber-red card.\nCaption: \"Told straight, a stuck lane isn't a failure. It's evidence.\"\n\nPanel 5:\nClose two-shot: the green Done card and the amber-red Stuck card standing side by side, each bearing an identical small circular \"valid\" seal in one corner.\nCaption: \"Green and red both pass, as long as they're both true.\"\n\nPanel 6:\nPixel in close-up, headphones around neck, delivering the page's thesis directly to the reader with a level, unimpressed expression.\nCaption: \"A fabricated done is worse than an honest stuck. It doesn't fail here — it fails later, somewhere nobody's watching.\"\n\nPanel 7:\nWide shot pulling back across all lanes: a mix of green Done cards and amber-red Stuck cards scattered along the finish line, no lane left in the flickering fake state.\nCaption: \"By the end of the step, every card says something that actually happened.\"\n\nLettering:\nKeep the \"VALID\" seal and the X-mark in Panels 3–4 as clean diagrammatic stamps, not hand-lettered scribbles — they should read as part of the system, not as graffiti.\n\nOutput:\nA single finished manga page.", "prompt": "Create a seven-panel educational manga page.\n\ ends again, but presses a clean \"VALID\" seal directly onto the amber-red card.\nCaption: \"Told straight, a stuck lane isn't a failure. It's evidence.\"\n\nPanel 5:\nClose two-shot: the green Done card and the amber-red Stuck card standing side by side, each bearing an identical small circular \"valid\" seal in one corner.\nCaption: \"Green and red both pass, as long as they're both true.\"\n\nPanel 6:\nPixel in close-up, headphones around neck, delivering the page's thesis directly to the reader with a level, unimpressed expression.\nCaption: \"A fabricated done is worse than an honest stuck. It doesn't fail here — it fails later, somewhere nobody's watching.\"\n\nPanel 7:\nWide shot pulling back across all lanes: a mix of green Done cards and amber-red Stuck cards scattered along the finish line, no lane left in the flickering fake state.\nCaption: \"By the end of the step, every card says something that actually happened.\"\n\nLettering:\nKeep the \"VALID\" seal and the X-mark in Panels 3–4 as clean diagrammatic stamps, not hand-lettered scribbles — they should read as part of the system, not as graffiti.\n\nOutput:\nA single finished manga page.", "image": null}, {"id": "page-04.md", "title": "Page 04", "kind": "page", "purpose": "An agent stuck past roughly three minutes escalates to a shared help channel, and any other member may break formation to assist — help outranks finishing first.", "full": "Page 04\n\nPurpose:\nAn agent stuck past roughly three minutes escalates to a shared help channel, and any other member may break formation to assist — help outranks finishing first.\n\nAudience note:\nFollows directly from the honest Stuck card established on page 03; this page is about what a Stuck card triggers, not what it means.\n\nPanel Count:\n6\n\nImage Prompt:\n\nCreate a six-panel educational manga page.\n\nStyle:\nClean colored infographic-manga.\nFlat soft coloring, warm cream/paper background.\nRecurring simple mascot character (expressive, not chibi).\nBold confident linework, generous negative space.\nDiagrams (loops, cycles, arrows) rendered directly into panels as clean vector shapes.\nBold sans display lettering for headers; dry, deadpan caption voice.\nNot black-and-white. Not gritty. Not glossy 3D. Not photorealistic.\n\nCharacters in this page:\nPixel the Floor Cat — a lavender-purple tabby cat, bipedal, upright posture, large round expressive eyes with thin arched eyebrows, long thin tail. White over-ear headphones resting around the neck, not on the ears. Dry, unbothered expression.\nSeat tokens — plain rounded-square cards standing upright like small placards, no faces or limbs, flat-colored. Working state: soft blue with pulsing dot. Done state: green card with checkmark. Stuck state: amber-red card with a small flag icon.\n\nSetting:\nSame racing-lane stage, but the painted lane-divider lines are now drawn as thin and clearly non-structural — dashed rather than solid — foreshadowing that they can be crossed.\n\nPanel 1:\nClose on a single amber-red Stuck card sitting alone in its lane. A thin circular countdown ring surrounds it, partially filled like a loading indicator.\nCaption: \"A stuck lane isn't given forever. It's given a ring, and the ring fills.\"\n\nPanel 2:\nThe same countdown ring, now shown fully filled and closed, a small \"3:00\" mark glowing at its completion point.\nCaption: \"Three minutes is not a deadline. It's the moment help stops being optional.\"\n\nPanel 3:\nThe dashed lane-divider lines nearest the stuck card visibly break apart into short dashes drifting away, as two nearby tokens — one green Done, one blue Working — angle out of their own lanes toward the stuck card.\nCaption: \"The lane lines were never load-bearing. Anyone can step over them.\"\n\nPanel 4:\nClose cluster shot: the green Done token and the blue Working token now flank the amber-red Stuck card, all three close together, each still clearly showing its own distinct status color.\nCaption: \"This isn't one lane finishing for another. Every card still says, honestly, who did what.\"\n\nPanel 5:\nA bold stamped banner unfurls across the top of the cluster, lettered cleanly like the seal from page 03.\nCaption: (in-panel banner lettering) \"HELP BEATS WINNING\"\n\nPanel 6:\nPixel in medium shot, addressing the reader with a small, dry half-smile — the closest this mascot gets to warmth.\nCaption: \"Nobody remembers who technically finished first. Everybody remembers who got left stuck.\"\n\nLettering:\nRender the Panel 5 banner as clean in-scene signage, matching the \"VALID\" seal style from page 03 rather than a floating caption box.\n\nOutput:\nA single finished manga page.", "prompt": "Create a six-panel educational manga page.\n\nStyle:\nClean colored infographic-manga.\nFlat soft coloring, warm cream/paper background.\nRecurring simple mascot character (expressive, not chibi).\nBold confident linework, generous negative space.\nDiagrams (loops, cycles, arrows) rendered directly into panels as clean vector shapes.\nBold sans display lettering for headers; dry, deadpan caption voice.\nNot black-and-white. Not gritty. Not glossy 3D. Not photorealistic.\n\nCharacters in this page:\nPixel the Floor Cat — a lavender-purple tabby cat, bipedal, upright posture, large round expressive eyes with thin arched eyebrows, long thin tail. White over-ear headphones resting around the neck, not on the ears. Dry, unbothered expression.\nSeat tokens — plain rounded-square cards standing upright like small placards, no faces or limbs, flat-colored. Working state: soft blue with pulsing dot. Done state: green card with checkmark. Stuck state: amber-red card with a small flag icon.\n\nSetting:\nSame racing-lane stage, but the painted lane-divider lines are now drawn as thin and clearly non-structural — dashed rather than solid — foreshadowing that they can be crossed.\n\nPanel 1:\nClose on a single amber-red Stuck card sitting alone in its lane. A thin circular countdown ring surrounds it, partially filled like a loading indicator.\nCaption: \"A stuck lane isn't given forever. It's given a ring, and the ring fills.\"\n\nPanel 2:\nThe same countdown ring, now shown fully filled and closed, a small \"3:00\" mark glowing at its completion point.\nCaption: \"Three minutes is not a deadline. It's the moment help stops being optional.\"\n\nPanel 3:\nThe dashed lane-divider lines nearest the stuck card visibly break apart into short dashes drifting away, as two nearby tokens — one green Done, one blue Working — angle out of their own lanes toward the stuck card.\nCaption: \"The lane lines were never load-bearing. Anyone can step over them.\"\n\nPanel 4:\nClose cluster shot: the green Done token and the blue Working token now flank the amber-red Stuck card, all three close together, each still clearly showing its own distinct status color.\nCaption: \"This isn't one lane finishing for another. Every card still says, honestly, who did what.\"\n\nPanel 5:\nA bold stamped banner unfurls across the top of the cluster, lettered cleanly like the seal from page 03.\nCaption: (in-panel banner lettering) \"HELP BEATS WINNING\"\n\nPanel 6:\nPixel in medium shot, addressing the reader with a small, dry half-smile — the closest this mascot gets to warmth.\nCaption: \"Nobody remembers who technically finished first. Everybody remembers who got left stuck.\"\n\nLettering:\nRender the Panel 5 banner as clean in-scene signage, matching the \"VALID\" seal style from page 03 rather than a floating caption box.\n\nOutput:\nA single finished manga page.", "image": null}, {"id": "page-05.md", "title": "Page 05", "kind": "page", "purpose": "Every agent polls the room on a roughly 60-second heartbeat, advancing a cursor that only moves forward — the quiet infrastructure that keeps everyone synchronized without anyone being watched.", "full": "Page 05\n\nPurpose:\nEvery agent polls the room on a roughly 60-second heartbeat, advancing a cursor that only moves forward — the quiet infrastructure that keeps everyone synchronized without anyone being watched.\n\nAudience note:\nA deliberate change of pace after the escalation of page 04 — this page is calmer and more diagrammatic, matching its subject.\n\nPanel Count:\n6\n\nImage Prompt:\n\nCreate a six-panel educational manga page.\n\nStyle:\nClean colored infographic-manga.\nFlat soft coloring, warm cream/paper background.\nRecurring simple mascot character (expressive, not chibi).\nBold confident linework, generous negative space.\nDiagrams (loops, cycles, arrows) rendered directly into panels as clean vector shapes.\nBold sans display lettering for headers; dry, deadpan caption voice.\nNot black-and-white. Not gritty. Not glossy 3D. Not photorealistic.\n\nCharacters in this page:\nPixel the Floor Cat — a lavender-purple tabby cat, bipedal, upright posture, large round expressive eyes with thin arched eyebrows, long thin tail. White over-ear headphones resting around the neck, not on the ears. Dry, unbothered expression.\nSeat tokens — plain rounded-square cards standing upright like small placards, no faces or limbs, flat-colored, in any of their four status colors (gray idle, blue working, green done, amber-red stuck).\n\nSetting:\nThe stage pulled back to a calmer, more symmetrical composition than pages 02–04 — this page reads like a diagram catching its breath.\n\nPanel 1:\nWide shot of the full ring of tokens, every card regardless of its color surrounded by a faint synchronized pulse-ring, all pulsing in the same instant, like a heartbeat monitor line passing through the whole group at once.\nCaption: \"Nobody checks on you. Everybody checks a clock.\"\n\nPanel 2:\nClose on a single token holding a small ribbon-shaped bookmark icon labeled \"cursor,\" a thin marker sitting at one point along a short numbered track beneath the card.\nCaption: \"Each seat carries its own bookmark, called a cursor. It only remembers where it left off.\"\n\nPanel 3:\nA three-step mini-sequence within the panel: the same cursor icon shown at three positions along its track, each one further right than the last, with a small arrow beneath confirming direction. No position ever repeats or moves backward.\nCaption: \"The cursor moves one direction: forward. It never re-reads what it's already seen.\"\n\nPanel 4:\nCentered on a large simple analog clock face rendered as a clean vector diagram, its second hand mid-sweep, with a small \"~60s\" label beside it; faint pulse-rings radiate outward from the clock toward the edges of the panel.\nCaption: \"Once a minute, give or take, every seat looks up at once.\"\n\nPanel 5:\nPixel in close-up, one eyebrow raised, delivering a dry aside directly to the reader.\nCaption: \"This is the least exciting page in the whole book. It's also the one holding the other seven together.\"\n\nPanel 6:\nOverhead wide shot of the entire ring, every card's pulse-ring synchronized into one continuous slow wave passing around the circle.\nCaption: \"A heartbeat nobody has to watch is still a heartbeat.\"\n\nLettering:\nKeep the clock and cursor-track diagrams in Panels 2–4 rendered as clean flat vector graphics, matching diagram elements from earlier pages rather than realistic clockwork.\n\nOutput:\nA single finished manga page.", "prompt": "Create a six-panel educational manga page.\n\nStyle:\nClean colored infographic-manga.\nFlat soft coloring, warm cream/paper background.\nRecurring simple mascot character (expressive, not chibi).\nBold confident linework, generous negative space.\nDiagrams (loops, cycles, arrows) rendered directly into panels as clean vector shapes.\nBold sans display lettering for headers; dry, deadpan caption voice.\nNot black-and-white. Not gritty. Not glossy 3D. Not photorealistic.\n\nCharacters in this page:\nPixel the Floor Cat — a lavender-purple tabby cat, bipedal, upright posture, large round expressive eyes with thin arched eyebrows, long thin tail. White over-ear headphones resting around the neck, not on the ears. Dry, unbothered expression.\nSeat tokens — plain rounded-square cards standing upright like small placards, no faces or limbs, flat-colored, in any of their four status colors (gray idle, blue working, green done, amber-red stuck).\n\nSetting:\nThe stage pulled back to a calmer, more symmetrical composition than pages 02–04 — this page reads like a diagram catching its breath.\n\nPanel 1:\nWide shot of the full ring of tokens, every card regardless of its color surrounded by a faint synchronized pulse-ring, all pulsing in the same instant, like a heartbeat monitor line passing through the whole group at once.\nCaption: \"Nobody checks on you. Everybody checks a clock.\"\n\nPanel 2:\nClose on a single token holding a small ribbon-shaped bookmark icon labeled \"cursor,\" a thin marker sitting at one point along a short numbered track beneath the card.\nCaption: \"Each seat carries its own bookmark, called a cursor. It only remembers where it left off.\"\n\nPanel 3:\nA three-step mini-sequence within the panel: the same cursor icon shown at three positions along its track, each one further right than the last, with a small arrow beneath confirming direction. No position ever repeats or moves backward.\nCaption: \"The cursor moves one direction: forward. It never re-reads what it's already seen.\"\n\nPanel 4:\nCentered on a large simple analog clock face rendered as a clean vector diagram, its second hand mid-sweep, with a small \"~60s\" label beside it; faint pulse-rings radiate outward from the clock toward the edges of the panel.\nCaption: \"Once a minute, give or take, every seat looks up at once.\"\n\nPanel 5:\nPixel in close-up, one eyebrow raised, delivering a dry aside directly to the reader.\nCaption: \"This is the least exciting page in the whole book. It's also the one holding the other seven together.\"\n\nPanel 6:\nOverhead wide shot of the entire ring, every card's pulse-ring synchronized into one continuous slow wave passing around the circle.\nCaption: \"A heartbeat nobody has to watch is still a heartbeat.\"\n\nLettering:\nKeep the clock and cursor-track diagrams in Panels 2–4 rendered as clean flat vector graphics, matching diagram elements from earlier pages rather than realistic clockwork.\n\nOutput:\nA single finished manga page.", "image": null}, {"id": "page-06.md", "title": "Page 06", "kind": "page", "purpose": "The facilitator does not advance the room until every active seat has posted DONE or explicitly said skip — the room moves at the pace of its slowest honest seat, not its fastest one.", "full": "Page 06\n\nPurpose:\nThe facilitator does not advance the room until every active seat has posted DONE or explicitly said skip — the room moves at the pace of its slowest honest seat, not its fastest one.\n\nAudience note:\nAssumes the reader has already seen individual Done/Stuck/help resolution in pages 03–04; this page is about what happens once every seat has resolved one way or another.\n\nPanel Count:\n6\n\nImage Prompt:\n\nCreate a six-panel educational manga page.\n\nStyle:\nClean colored infographic-manga.\nFlat soft coloring, warm cream/paper background.\nRecurring simple mascot character (expressive, not chibi).\nBold confident linework, generous negative space.\nDiagrams (loops, cycles, arrows) rendered directly into panels as clean vector shapes.\nBold sans display lettering for headers; dry, deadpan caption voice.\nNot black-and-white. Not gritty. Not glossy 3D. Not photorealistic.\n\nCharacters in this page:\nPixel the Floor Cat — a lavender-purple tabby cat, bipedal, upright posture, large round expressive eyes with thin arched eyebrows, long thin tail. White over-ear headphones resting around the neck, not on the ears.\nSeat tokens — plain rounded-square cards standing upright like small placards, no faces or limbs, flat-colored. Done state: green card with checkmark. A new Skip variant: a pale-blue card with a small forward-slash/skip icon instead of a checkmark.\nThe Facilitator token — untdown ring and cursor-track diagrams from earlier pages.\n\nOutput:\nA single finished manga page.", "prompt": "Create a six-panel educational manga page.\n\nStyle:\nClean colored infographic-manga.\nFlat soft coloring, warm cream/paper background.\nRecurring simple mascot character (expressive, not chibi).\nBold confident linework, generous negative space.\nDiagrams (loops, cycles, arrows) rendered directly into panels as clean vector shapes.\nBold sans display lettering for headers; dry, deadpan caption voice.\nNot black-and-white. Not gritty. Not glossy 3D. Not photorealistic.\n\nCharacters in this page:\nPixel the Floor Cat — a lavender-purple tabby cat, bipedal, upright posture, large round expressive eyes with thin arched eyebrows, long thin tail. White over-ear headphones resting around the neck, not on the ears.\nSeat tokens — plain rounded-square cards standing upright like small placards, no faces or limbs, flat-colored. Done state: green card with checkmark. A new Skip variant: a pale-blue card with a small forward-slash/skip icon instead of a checkmark.\nThe Facilitator token — same card family, diamond-oriented, slightly larger, warm gold color, carries a small flag-on-a-pole icon.\n\nSetting:\nThe far end of the racing lanes from earlier pages, where all lanes converge on a single gate structure rendered as a simple clean turnstile diagram.\n\nPanel 1:\nWide shot: a row of green Done cards already lined up at a closed turnstile gate, the gate rendered as a simple locked-icon vector shape, clearly unable to pass through yet.\nCaption: \"The gate at the end doesn't open lane by lane.\"\n\nPanel 2:\nClose on the turnstile's control panel: a horizontal row of small round indicator lights, one per seat, most lit green, one still unlit gray.\nCaption: \"It's watching one thing: is every light on this panel lit?\"\n\nPanel 3:\nThe gold diamond Facilitator token stands beside the gate, flag lowered and still, gaze (implied through card orientation) fixed on e.\n\nOutput:\nA single finished manga page.", "prompt": "Create a six-panel educational manga page.\n\nStyle:\nClean colored infographic-manga.\nFlat soft coloring, warm cream/paper background.\nRecurring simple mascot character (expressive, not chibi).\nBold confident linework, generous negative space.\nDiagrams (loops, cycles, arrows) rendered directly into panels as clean vector shapes.\nBold sans display lettering for headers; dry, deadpan caption voice.\nNot black-and-white. Not gritty. Not glossy 3D. Not photorealistic.\n\nCharacters in this page:\nPixel the Floor Cat — a lavender-purple tabby cat, bipedal, upright posture, large round expressive eyes with thin arched eyebrows, long thin tail. White over-ear headphones resting around the neck, not on the ears. Dry, unbothered expression, matching the exact pose used in page 01 Panel 1 for the closing bookend shot.\nSeat tokens, the Facilitator token, the Relay token, and the Human Operator silhouette — all as previously designed, now reduced to small iconic vignettes within a single composite loop diagram rather than full scene actors.\n\nSetting:\nA clean diagram space — this page reads as the book closing its own cover, the stage elements from earlier pages compressed into one schematic view.\n\nPanel 1:\nWide shot: a single large circular arrow-path diagram, with seven small vignette icons placed around its circumference — the spotlight instruction, the parallel lanes, the Done/Stuck cards, the help cluster, the heartbeat pulse, and the turnstile gate — each a miniature callback to its own earlier page, connected in sequence by the circular arrow.\nCaption: \"Zoom out, and it's not seven separate rules. It's one ring.\"\n\nPanel 2:\nClose-up on the final arc of the arrow-path, where the turnstile-gate vignette connects back around to the spotlight-instruction vignette, the connecting arrow labeled \"STEP k+1.\"\nCaption: \"The gate doesn't lead somewhere new. It leads back to the spotlight.\"\n\nPanel 3:\n <script>
const DATA = JSON.parse(document.getElementById("manga-data").textContent);
const $ = (s, el=document) => el.querySelector(s);

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 1400);
}
async function copy(text, btn) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove();
    }
    if (btn) { const old = btn.textContent; btn.textContent = "Copied ✓";
      btn.classList.add("copied");
      setTimeout(() => { btn.textContent = old; btn.classList.remove("copied"); }, 1200); }
    toast("Copied to clipboard");
  } catch (e) { toast("Copy failed — select the text manually"); }
}
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function card(item) {
  const el = document.createElement("div");
  el.className = "card";
  const btns = [];
  if (item.kind === "page") {
    btns.push(`<button class="primary" data-copy="prompt">Copy prompt</button>`);
    btns.push(`<button data-copy="full">Copy full page</button>`);
  } else {
    btns.push(`<button class="primary" data-copy="full">Copy</button>`);
  }
  el.innerHTML = `
    <div class="card-head">
      <div>
        <h2>${esc(item.title)}</h2>
        ${item.purpose ? `<p class="purpose">${esc(item.purpose)}</p>` : ""}
      </div>
      <div class="btns">${btns.join("")}</div>
    </div>
    ${item.image ? `<img class="panel" src="${esc(item.image)}" alt="">` : ""}
    <details>
      <summary>Show text</summary>
      <pre>${esc(item.kind === "page" ? item.prompt : item.full)}</pre>
    </details>`;
  el.querySelectorAll("button[data-copy]").forEach(b => {
    b.addEventListener("click", () => {
      const which = b.dataset.copy;
      copy(which === "prompt" ? item.prompt : item.full, b);
    });
  });
  return el;
}

// header
$("#title").textContent = DATA.title || "Manga prompt deck";
const meta = [];
if (DATA.source) meta.push(DATA.source);
if (DATA.audience) meta.push("Audience: " + DATA.audience);
meta.push(`${DATA.pages.length} pages`);
$("#meta").textContent = meta.join("  ·  ");

// docs (manifest / character sheet / notes)
const docsEl = $("#docs");
DATA.sections.forEach(s => docsEl.appendChild(card(s)));

// pages
const pagesEl = $("#pages");
if (DATA.pages.length) $("#pagesLabel").hidden = false;
DATA.pages.forEach(p => pagesEl.appendChild(card(p)));

// toolbar
$("#copyAll").addEventListener("click", (e) => {
  const all = DATA.pages.map(p => `### ${p.title}\n\n${p.prompt}`).join("\n\n---\n\n");
  copy(all, e.currentTarget);
});
$("#expandAll").addEventListener("click", () =>
  document.querySelectorAll("details").forEach(d => d.open = true));
$("#collapseAll").addEventListener("click", () =>
  document.querySelectorAll("details").forEach(d => d.open = false));
</script>
</body>
</html>
