<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Box the Agent: Sandboxing at VCN #42</title>
<meta name="description" content="An educational manga explainer — a recap of the VCN #42 sandboxing workshop, where a deliberately malicious script was run inside a disposable container and failed to steal secrets or reach the internet.">
<meta property="og:title" content="Box the Agent: Sandboxing at VCN #42">
<meta property="og:description" content="An educational manga explainer from the VCN #42 sandboxing workshop.">
<meta property="og:image" content="pages/page-01.png">
<style>
  :root{
    --bg:#0e0f13; --panel:#16181f; --ink:#f4f5f7; --muted:#9aa1ac;
    --accent:#6ea8fe; --edge:#262a34; --shadow:rgba(0,0,0,.55);
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#eef0f4; --panel:#ffffff; --ink:#15171c; --muted:#5b626d;
      --accent:#2f6fed; --edge:#d9dde5; --shadow:rgba(20,30,60,.18); }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; min-height:100dvh;
    -webkit-font-smoothing:antialiased;
  }
  header{
    display:flex; align-items:center; gap:12px; justify-content:space-between;
    padding:12px 16px; border-bottom:1px solid var(--edge);
    background:var(--panel); position:sticky; top:0; z-index:5;
  }
  header .t{ min-width:0; }
  header h1{ font-size:15px; margin:0; letter-spacing:.2px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  header p{ margin:2px 0 0; font-size:12px; color:var(--muted); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  header .badge{ flex:none; font-size:11px; color:var(--muted); border:1px solid var(--edge);
    border-radius:999px; padding:3px 9px; }

  main{ flex:1; position:relative; overflow:hidden; padding:14px; }

  /* scrollable, zoomable page viewport */
  .viewport{
    position:absolute; inset:14px; overflow:auto; border-radius:14px;
    background:var(--panel); border:1px solid var(--edge);
    box-shadow:0 18px 50px var(--shadow);
    scrollbar-width:thin; -webkit-overflow-scrolling:touch; touch-action:pan-x pan-y;
  }
  .viewport::-webkit-scrollbar{ width:9px; height:9px; }
  .viewport::-webkit-scrollbar-thumb{ background:var(--edge); border-radius:99px; }
  .viewport img{
    display:block; margin:0 auto; width:100%; height:auto;
    user-select:none; -webkit-user-drag:none;
  }
  .viewport.zoomed{ cursor:grab; }
  .viewport.grabbing{ cursor:grabbing; }
  .viewport img.flip{ animation:flip .3s ease; }
  @keyframes flip{
    0%{ opacity:0; transform:translateX(var(--dir,18px)) scale(.985); }
    100%{ opacity:1; transform:none; }
  }

  /* click zones (paging) — hidden while zoomed */
  .zone{ position:absolute; top:14px; bottom:14px; width:30%; cursor:pointer; z-index:3;
    display:flex; align-items:center; transition:opacity .15s; }
  .zone.left{ left:14px; justify-content:flex-start; }
  .zone.right{ right:14px; justify-content:flex-end; }
  .zone .hint{ opacity:0; transition:opacity .15s; margin:0 10px;
    background:var(--panel); border:1px solid var(--edge); color:var(--ink);
    width:40px; height:40px; border-radius:50%; display:grid; place-items:center;
    font-size:18px; box-shadow:0 6px 18px var(--shadow); }
  .zone:hover .hint{ opacity:.92; }
  .zone.disabled{ cursor:default; }
  .zone.disabled .hint{ display:none; }
  main.zoomed .zone{ pointer-events:none; opacity:0; }

  /* zoom controls */
  .zoombar{ position:absolute; top:24px; right:26px; z-index:5; display:flex; gap:2px;
    background:var(--panel); border:1px solid var(--edge); border-radius:10px; padding:4px;
    box-shadow:0 6px 18px var(--shadow); }
  .zoombar button{ appearance:none; border:0; background:transparent; color:var(--ink);
    height:30px; min-width:32px; border-radius:7px; cursor:pointer; font-size:16px; line-height:1;
    display:grid; place-items:center; padding:0 6px; }
  .zoombar button:hover:not(:disabled){ background:var(--bg); }
  .zoombar button:disabled{ opacity:.35; cursor:default; }
  .zoombar .lvl{ font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; min-width:44px; }

  footer{
    display:flex; align-items:center; justify-content:center; gap:14px;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--edge); background:var(--panel);
  }
  button.nav{
    appearance:none; border:1px solid var(--edge); background:transparent; color:var(--ink);
    border-radius:10px; padding:9px 14px; font-size:14px; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px; transition:background .15s,border-color .15s;
  }
  button.nav:hover:not(:disabled){ background:var(--bg); border-color:var(--accent); }
  button.nav:disabled{ opacity:.35; cursor:default; }
  .counter{ font-variant-numeric:tabular-nums; color:var(--muted); font-size:13px; min-width:74px;
    text-align:center; }
  .counter b{ color:var(--ink); }

  .progress{ position:absolute; left:14px; right:14px; bottom:6px; height:3px; z-index:4;
    border-radius:2px; overflow:hidden; background:transparent; pointer-events:none; }
  .progress i{ display:block; height:100%; background:var(--accent); width:0; transition:width .25s ease; }

  .foot-links{ position:fixed; right:14px; bottom:64px; z-index:6; }
  .foot-links a{ color:var(--muted); font-size:12px; text-decoration:none; border:1px solid var(--edge);
    background:var(--panel); border-radius:999px; padding:5px 11px; box-shadow:0 6px 18px var(--shadow); }
  .foot-links a:hover{ color:var(--ink); border-color:var(--accent); }

  /* thumbnail strip */
  .thumbs{
    display:flex; gap:8px; align-items:center; overflow-x:auto; overflow-y:hidden;
    padding:10px 14px; border-top:1px solid var(--edge); background:var(--panel);
    scroll-behavior:smooth; scrollbar-width:thin; -webkit-overflow-scrolling:touch;
  }
  .thumbs::-webkit-scrollbar{ height:7px; }
  .thumbs::-webkit-scrollbar-thumb{ background:var(--edge); border-radius:99px; }
  .thumb{
    flex:0 0 auto; width:52px; height:70px; border-radius:7px; overflow:hidden;
    border:2px solid transparent; background:var(--bg); cursor:pointer; padding:0;
    position:relative; transition:border-color .15s, transform .12s; opacity:.7;
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; object-position:top center; display:block; }
  .thumb:hover{ opacity:1; transform:translateY(-2px); }
  .thumb .no{ position:absolute; left:0; right:0; bottom:0; font-size:10px; text-align:center;
    color:#fff; background:rgba(0,0,0,.55); padding:1px 0; font-variant-numeric:tabular-nums; }
  .thumb.active{ border-color:var(--accent); opacity:1; }

  @media (max-width:520px){
    header h1{ font-size:13.5px; } .badge{ display:none; }
    .foot-links{ display:none; }
    .thumb{ width:44px; height:60px; }
  }
</style>
</head>
<body>
  <header>
    <div class="t">
      <h1>Box the Agent: Sandboxing at VCN&nbsp;#42</h1>
      <p>An educational manga explainer · Immersive Commons, Frontier Tower SF</p>
    </div>
    <span class="badge" id="badge">Page 1 / 12</span>
  </header>

  <main id="main">
    <div class="viewport" id="viewport">
      <img id="page" alt="Comic page" src="pages/page-01.png">
    </div>
    <div class="zone left disabled" id="zl" aria-label="Previous page"><span class="hint">‹</span></div>
    <div class="zone right" id="zr" aria-label="Next page"><span class="hint">›</span></div>
    <div class="zoombar" aria-label="Zoom controls">
      <button id="zout" type="button" title="Zoom out (−)">−</button>
      <button id="zfit" type="button" class="lvl" title="Fit page (0)">Fit</button>
      <button id="zfw" type="button" title="Fit width (W)">↔</button>
      <button id="zin" type="button" title="Zoom in (+)">+</button>
    </div>
    <div class="progress"><i id="bar"></i></div>
  </main>

  <div class="foot-links">
    <a href="https://comicexplain.com/c/box-the-agent-sandboxing-at-vcn-42-6ac3ec" target="_blank" rel="noopener">View on ComicExplain ↗</a>
  </div>

  <nav class="thumbs" id="thumbs" aria-label="Page thumbnails"></nav>

  <footer>
    <button class="nav" id="prev">‹ Prev</button>
    <span class="counter"><b id="cur">1</b> / <span id="tot">12</span></span>
    <button class="nav" id="next">Next ›</button>
  </footer>

<script>
(function(){
  var TOTAL = 12;
  var pad = function(n){ return (n<10?'0':'')+n; };
  var src = function(n){ return 'pages/page-'+pad(n)+'.png'; };

  var img   = document.getElementById('page');
  var cur   = document.getElementById('cur');
  var badge = document.getElementById('badge');
  var bar   = document.getElementById('bar');
  var prev  = document.getElementById('prev');
  var next  = document.getElementById('next');
  var zl    = document.getElementById('zl');
  var zr    = document.getElementById('zr');
  var thumbs= document.getElementById('thumbs');
  var main     = document.getElementById('main');
  var viewport = document.getElementById('viewport');
  var zin   = document.getElementById('zin');
  var zout  = document.getElementById('zout');
  var zfit  = document.getElementById('zfit');
  var zfw   = document.getElementById('zfw');

  var page = 1;
  var thumbEls = [];

  // zoom state
  var zoom = 1, naturalAR = 0;
  var ZMIN = 1, ZMAX = 5, ZSTEP = 1.5;

  // build the thumbnail strip
  (function buildThumbs(){
    for(var n=1;n<=TOTAL;n++){
      (function(n){
        var b = document.createElement('button');
        b.className = 'thumb'; b.type='button';
        b.setAttribute('aria-label','Go to page '+n);
        var im = document.createElement('img');
        im.loading='lazy'; im.src=src(n); im.alt='Page '+n+' thumbnail';
        var no = document.createElement('span'); no.className='no'; no.textContent=n;
        b.appendChild(im); b.appendChild(no);
        b.addEventListener('click', function(){ go(n); });
        thumbs.appendChild(b); thumbEls.push(b);
      })(n);
    }
  })();

  function syncThumbs(){
    for(var i=0;i<thumbEls.length;i++){
      thumbEls[i].classList.toggle('active', (i+1)===page);
    }
    var act = thumbEls[page-1];
    if(act){ act.scrollIntoView({block:'nearest', inline:'center'}); }
  }

  // ---- zoom + pan ----
  function baseWidth(){
    var vw = viewport.clientWidth, vh = viewport.clientHeight;
    if(!naturalAR) return vw;
    return Math.min(vw, vh * naturalAR);   // width that fits the whole page
  }
  function applyZoom(){
    img.style.width = (baseWidth() * zoom) + 'px';
    var z = zoom > 1.001;
    main.classList.toggle('zoomed', z);
    viewport.classList.toggle('zoomed', z);
    zfit.textContent = z ? Math.round(zoom * 100) + '%' : 'Fit';
    zout.disabled = zoom <= ZMIN + 0.001;
    zin.disabled  = zoom >= ZMAX - 0.001;
  }
  function setZoom(nz, cx, cy){
    nz = Math.max(ZMIN, Math.min(ZMAX, nz));
    var rect = viewport.getBoundingClientRect();
    if(cx==null) cx = rect.width/2;
    if(cy==null) cy = rect.height/2;
    var preW = img.offsetWidth || 1, preH = img.offsetHeight || 1;
    var relX = (viewport.scrollLeft + cx) / preW;   // keep the point under the cursor fixed
    var relY = (viewport.scrollTop  + cy) / preH;
    zoom = nz; applyZoom();
    viewport.scrollLeft = relX * img.offsetWidth  - cx;
    viewport.scrollTop  = relY * img.offsetHeight - cy;
  }

  img.addEventListener('load', function(){
    if(img.naturalWidth){ naturalAR = img.naturalWidth / img.naturalHeight; applyZoom(); }
  });

  function fitWidthZoom(){ var bw = baseWidth(); return bw > 0 ? viewport.clientWidth / bw : 1; }
  function setFitWidth(){
    setZoom(fitWidthZoom(), viewport.getBoundingClientRect().width/2, 0);
    viewport.scrollTop = 0;
  }

  zin.addEventListener('click',  function(){ setZoom(zoom * ZSTEP); });
  zout.addEventListener('click', function(){ setZoom(zoom / ZSTEP); });
  zfit.addEventListener('click', function(){ setZoom(1); });
  zfw.addEventListener('click',  setFitWidth);

  viewport.addEventListener('dblclick', function(e){
    var rect = viewport.getBoundingClientRect();
    var cx = e.clientX - rect.left, cy = e.clientY - rect.top;
    if(zoom > 1.001) setZoom(1); else setZoom(2.2, cx, cy);
  });

  // ctrl + wheel to zoom (plain wheel scrolls the page)
  viewport.addEventListener('wheel', function(e){
    if(!e.ctrlKey) return;
    e.preventDefault();
    var rect = viewport.getBoundingClientRect();
    setZoom(zoom * (e.deltaY < 0 ? 1.12 : 0.9), e.clientX - rect.left, e.clientY - rect.top);
  }, {passive:false});

  // mouse drag to pan while zoomed
  var panning=false, px=0, py=0, sl=0, st=0;
  viewport.addEventListener('mousedown', function(e){
    if(zoom <= 1.001) return;
    panning=true; px=e.clientX; py=e.clientY; sl=viewport.scrollLeft; st=viewport.scrollTop;
    viewport.classList.add('grabbing'); e.preventDefault();
  });
  window.addEventListener('mousemove', function(e){
    if(!panning) return;
    viewport.scrollLeft = sl - (e.clientX - px);
    viewport.scrollTop  = st - (e.clientY - py);
  });
  window.addEventListener('mouseup', function(){ panning=false; viewport.classList.remove('grabbing'); });

  window.addEventListener('resize', function(){ applyZoom(); });

  // preload neighbours for snappy flips
  function preload(n){ if(n>=1&&n<=TOTAL){ var i=new Image(); i.src=src(n); } }

  function fromHash(){
    var m = /page-(\d+)/.exec(location.hash||'');
    var n = m ? parseInt(m[1],10) : 1;
    return (n>=1 && n<=TOTAL) ? n : 1;
  }

  function render(dir){
    img.style.setProperty('--dir', (dir<0?'-18px':'18px'));
    img.classList.remove('flip'); void img.offsetWidth; img.classList.add('flip');
    img.src = src(page);
    img.alt = 'Comic page ' + page + ' of ' + TOTAL;
    cur.textContent = page;
    badge.textContent = 'Page ' + page + ' / ' + TOTAL;
    bar.style.width = (page/TOTAL*100) + '%';
    prev.disabled = (page===1);
    next.disabled = (page===TOTAL);
    zl.classList.toggle('disabled', page===1);
    zr.classList.toggle('disabled', page===TOTAL);
    zoom = 1; viewport.scrollLeft = 0; viewport.scrollTop = 0; applyZoom();
    syncThumbs();
    preload(page+1); preload(page-1);
  }

  function go(n, dir){
    n = Math.max(1, Math.min(TOTAL, n));
    if(n===page && dir!==0) return;
    dir = (n<page)? -1 : 1;
    page = n;
    if(('#page-'+page) !== location.hash){
      history.replaceState(null,'','#page-'+page);
    }
    render(dir);
  }

  prev.addEventListener('click', function(){ go(page-1); });
  next.addEventListener('click', function(){ go(page+1); });
  zl.addEventListener('click', function(){ go(page-1); });
  zr.addEventListener('click', function(){ go(page+1); });

  document.addEventListener('keydown', function(e){
    var z = zoom > 1.001;
    if(e.key==='ArrowRight'||e.key==='PageDown'){ e.preventDefault(); go(page+1); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); go(page-1); }
    else if(e.key===' '){ e.preventDefault(); if(z){ viewport.scrollTop += viewport.clientHeight*0.85; } else { go(page+1); } }
    else if(e.key==='ArrowDown'){ if(z){ e.preventDefault(); viewport.scrollTop += 90; } }
    else if(e.key==='ArrowUp'){ if(z){ e.preventDefault(); viewport.scrollTop -= 90; } }
    else if(e.key==='Home'){ e.preventDefault(); go(1); }
    else if(e.key==='End'){ e.preventDefault(); go(TOTAL); }
    else if(e.key==='+'||e.key==='='){ e.preventDefault(); setZoom(zoom*ZSTEP); }
    else if(e.key==='-'||e.key==='_'){ e.preventDefault(); setZoom(zoom/ZSTEP); }
    else if(e.key==='0'){ e.preventDefault(); setZoom(1); }
    else if(e.key==='w'||e.key==='W'){ e.preventDefault(); setFitWidth(); }
  });

  // touch: swipe to page (only at fit) + pinch to zoom
  var sx=0, sy=0, tracking=false;
  var pinching=false, pDist=0, pZoom=1, pMidX=0, pMidY=0;
  function tdist(e){ var a=e.touches[0], b=e.touches[1];
    return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); }
  viewport.addEventListener('touchstart', function(e){
    if(e.touches.length===2){
      pinching=true; tracking=false; pDist=tdist(e); pZoom=zoom;
      var rect=viewport.getBoundingClientRect();
      pMidX=(e.touches[0].clientX+e.touches[1].clientX)/2 - rect.left;
      pMidY=(e.touches[0].clientY+e.touches[1].clientY)/2 - rect.top;
      return;
    }
    if(e.touches.length!==1) return;
    tracking = (zoom <= 1.001); sx=e.touches[0].clientX; sy=e.touches[0].clientY;
  }, {passive:true});
  viewport.addEventListener('touchmove', function(e){
    if(pinching && e.touches.length===2){
      e.preventDefault();
      if(pDist>0) setZoom(pZoom * tdist(e)/pDist, pMidX, pMidY);
    }
  }, {passive:false});
  viewport.addEventListener('touchend', function(e){
    if(pinching && e.touches.length<2) pinching=false;
    if(!tracking) return; tracking=false;
    var t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(zoom<=1.001 && Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)){ go(dx<0 ? page+1 : page-1); }
  }, {passive:true});

  window.addEventListener('hashchange', function(){ go(fromHash()); });

  page = fromHash();
  render(0);
  if(img.complete && img.naturalWidth){
    naturalAR = img.naturalWidth / img.naturalHeight; applyZoom();
  }
})();
</script>
</body>
</html>
